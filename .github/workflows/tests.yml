name: Regression checks
on:
  pull_request:
  push:
    branches: [master]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r backend/requirements.txt PyYAML==6.0.2
      - run: python scripts/tests/manifest_merge_test.py
      - run: npm ci --ignore-scripts
      - run: npm run test:backend
      - run: npm ci --prefix cloudflare --ignore-scripts
      - run: npm test --prefix cloudflare
      - run: npm run check --prefix cloudflare
      - run: npm run test:desktop
      - run: npm run test:frontend -- --watchAll=false --runInBand
        env:
          CI: "true"
      - run: npm run build:frontend
        env:
          CI: "true"
